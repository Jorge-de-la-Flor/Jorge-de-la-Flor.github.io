<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }} - Jorge de la Flor</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           VARIABLES Y RESET
        ============================================ */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-card-hover: #22222e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --border-color: #2a2a3a;
            --accent-blue: #3b82f6;
            --accent-blue-light: #60a5fa;
            --accent-orange: #f97316;
            --accent-cyan: #06b6d4;
            --gradient-text: linear-gradient(135deg, #3b82f6, #06b6d4, #f97316);
            --shadow-glow: 0 0 60px rgba(59, 130, 246, 0.15);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --max-width: 1100px;
            --header-height: 70px;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-glow: 0 0 60px rgba(59, 130, 246, 0.1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--header-height);
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ============================================
           HEADER / NAVBAR
        ============================================ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            transition: background 0.3s;
        }

        [data-theme="light"] .header {
            background: rgba(248, 250, 252, 0.9);
        }

        .header-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: white;
        }

        .logo-text span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-left: 8px;
        }

        .theme-toggle:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        .sun-icon { display: none; }
        .moon-icon { display: block; }
        [data-theme="light"] .sun-icon { display: block; }
        [data-theme="light"] .moon-icon { display: none; }

        /* Mobile menu */
        .mobile-menu-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav { display: none; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .nav.open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: var(--header-height);
                left: 0;
                right: 0;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border-color);
                padding: 16px;
            }
        }

        /* ============================================
           MAIN CONTENT
        ============================================ */
        .main {
            padding-top: calc(var(--header-height) + 40px);
            min-height: calc(100vh - 200px);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 0 80px;
        }

        .hero-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 24px;
            border: 3px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-glow);
        }

        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-name {
            font-size: 3rem;
            font-weight: 800;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .hero-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            transition: all 0.2s;
        }

        .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .badge-python { color: #3b82f6; border-color: rgba(59, 130, 246, 0.3); }
        .badge-rust { color: #f97316; border-color: rgba(249, 115, 22, 0.3); }
        .badge-cpp { color: #06b6d4; border-color: rgba(6, 182, 212, 0.3); }

        .hero-social {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .social-link:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
        }

        /* Sections */
        .section {
            padding: 60px 0;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .section-divider {
            height: 1px;
            background: var(--border-color);
            margin-bottom: 32px;
        }

        /* Content styles from markdown */
        .content {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .content p { margin-bottom: 16px; }
        .content strong { color: var(--text-primary); font-weight: 600; }
        
        .content h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 48px 0 16px;
            color: var(--text-primary);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .content h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 32px 0 12px;
            color: var(--text-primary);
        }

        .content ul, .content ol {
            margin-left: 24px;
            margin-bottom: 16px;
        }

        .content li { margin-bottom: 8px; }

        .content a {
            color: var(--accent-blue);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .content a:hover {
            color: var(--accent-blue-light);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.3s;
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Table */
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .content th, .content td {
            padding: 16px 20px;
            text-align: left;
        }

        .content th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .content tr:not(:last-child) td {
            border-bottom: 1px solid var(--border-color);
        }

        .content td:first-child {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Code blocks */
        .content pre {
            background: #1e1e2e;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            margin: 24px 0;
            border: 1px solid var(--border-color);
        }

        .content code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
        }

        .content p code {
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* ============================================
           FOOTER
        ============================================ */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 40px 0;
            margin-top: 60px;
        }

        .footer-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--accent-blue);
        }

        .footer-link svg {
            width: 18px;
            height: 18px;
        }

        .footer-copy {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        .footer-copy .heart {
            color: #ef4444;
        }

        /* ============================================
           RESPONSIVE
        ============================================ */
        @media (max-width: 640px) {
            .hero-name { font-size: 2.2rem; }
            .hero-title { font-size: 1rem; }
            .section-title { font-size: 1.5rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="dark">

            </div>
            <p class="footer-copy">
                © 2025 Jorge de la Flor · Hecho con <span class="heart">❤</span> usando Python, Rust & C++
            </p>
        </div>
    </footer>

    <script>
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
        })();

        // Mobile menu
        function toggleMobileMenu() {
            document.getElementById('nav').classList.toggle('open');
        }
    </script>
</body>
</html>
