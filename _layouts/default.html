<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-ES' }}" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  {% seo %}
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  
  {% include head-custom.html %}
  
  <style>
    /* ========== VARIABLES ========== */
    :root {
      /* Light Mode */
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f4f4f5;
      --bg-code: #18181b;
      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --border: #e4e4e7;
      --accent-python: #3776ab;
      --accent-rust: #ce422b;
      --accent-cpp: #00599c;
      --accent-gradient: linear-gradient(135deg, #3776ab 0%, #ce422b 50%, #00599c 100%);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    }
    
    .dark-mode {
      --bg-primary: #09090b;
      --bg-secondary: #18181b;
      --bg-tertiary: #27272a;
      --bg-code: #09090b;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: #27272a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -1px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.4);
    }

    /* ========== RESET & BASE ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    /* ========== LAYOUT ========== */
    .site-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
    }
    
    .logo-icon {
      width: 120px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
    }
    
    .logo-text {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    
    .logo-text span {
      color: var(--text-muted);
      font-weight: 400;
    }
    
    .header-nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    
    .nav-links {
      display: flex;
      gap: 0.5rem;
      list-style: none;
    }
    
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .nav-links a:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }
    
    .theme-toggle {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .theme-toggle:hover {
      background: var(--bg-secondary);
      border-color: var(--text-muted);
    }
    
    /* ========== MAIN CONTENT ========== */
    .site-main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem;
    }
    
    /* ========== PROFILE HERO (para index) ========== */
    .profile-hero {
      text-align: center;
      padding: 2rem 0 3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }
    
    .profile-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--border);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
    }
    
    .profile-name {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .profile-title {
      font-size: 1.25rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    
    .tech-badges {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    
    .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }
    
    .tech-badge.python {
      color: var(--accent-python);
    }
    
    .tech-badge.rust {
      color: var(--accent-rust);
    }
    
    .tech-badge.cpp {
      color: var(--accent-cpp);
    }
    
    .tech-badge:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    
    .social-link {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    
    .social-link:hover {
      background: var(--text-primary);
      color: var(--bg-primary);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    
    /* ========== CONTENT STYLES ========== */
    .content-section {
      margin-bottom: 3rem;
    }
    
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border);
    }
    
    .section-icon {
      font-size: 1.25rem;
      color: var(--accent-python);
    }
    
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* ========== TYPOGRAPHY ========== */
    .site-main h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    .site-main h2 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }
    
    .site-main h3 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
      color: var(--text-primary);
    }
    
    .site-main h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      color: var(--text-secondary);
    }
    
    .site-main p {
      margin-bottom: 1.25rem;
      color: var(--text-secondary);
    }
    
    .site-main a {
      color: var(--accent-python);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }
    
    .site-main a:hover {
      border-bottom-color: var(--accent-python);
    }
    
    .site-main strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    
    .site-main ul, .site-main ol {
      margin: 1rem 0 1.5rem 1.5rem;
      color: var(--text-secondary);
    }
    
    .site-main li {
      margin-bottom: 0.5rem;
    }
    
    .site-main li::marker {
      color: var(--accent-python);
    }
    
    .site-main blockquote {
      border-left: 4px solid var(--accent-python);
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      background: var(--bg-tertiary);
      border-radius: 0 12px 12px 0;
      font-style: italic;
      color: var(--text-secondary);
    }
    
    .site-main hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 2.5rem 0;
    }

    /* ========== CODE BLOCKS ========== */
    .site-main code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.875em;
      background: var(--bg-code);
      color: #e4e4e7;
      padding: 0.2em 0.5em;
      border-radius: 6px;
    }
    
    .site-main pre {
      background: var(--bg-code);
      border-radius: 12px;
      padding: 1.5rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
      position: relative;
    }
    
    .site-main pre::before {
      content: attr(data-lang);
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-tertiary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
    
    .site-main pre code {
      background: none;
      padding: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e4e4e7;
    }

    /* Syntax Highlighting */
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp, 
    .highlight .kr, .highlight .kt { color: #c084fc; } /* Keywords - purple */
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb,
    .highlight .sc, .highlight .sd, .highlight .se, .highlight .sh,
    .highlight .sx { color: #86efac; } /* Strings - green */
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .cp,
    .highlight .cs { color: #6b7280; font-style: italic; } /* Comments - gray */
    .highlight .nf, .highlight .fm { color: #60a5fa; } /* Functions - blue */
    .highlight .nc, .highlight .nn { color: #fbbf24; } /* Classes - yellow */
    .highlight .mi, .highlight .mf, .highlight .mh, .highlight .mo { color: #f472b6; } /* Numbers - pink */
    .highlight .nb, .highlight .bp { color: #22d3ee; } /* Builtins - cyan */
    .highlight .o, .highlight .ow { color: #f87171; } /* Operators - red */
    .highlight .p { color: #e4e4e7; } /* Punctuation */
    .highlight .n, .highlight .na, .highlight .nv { color: #e4e4e7; } /* Names */

    /* ========== TABLES ========== */
    .site-main table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }
    
    .site-main th, .site-main td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    
    .site-main th {
      background: var(--bg-tertiary);
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .site-main tr:hover td {
      background: var(--bg-tertiary);
    }

    /* ========== CARDS ========== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--text-muted);
    }
    
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .card-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ========== FOOTER ========== */
    .site-footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
    }
    
    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }
    
    .footer-links a:hover {
      color: var(--text-primary);
    }
    
    .footer-copy {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    
    .footer-copy a {
      color: var(--accent-python);
      text-decoration: none;
    }

    /* ========== MOBILE RESPONSIVE ========== */
    @media (max-width: 768px) {
      .header-inner {
        padding: 1rem;
      }
      
      .nav-links {
        display: none;
      }
      
      .site-main {
        padding: 2rem 1rem;
      }
      
      .profile-name {
        font-size: 2rem;
      }
      
      .profile-title {
        font-size: 1.1rem;
      }
      
      .site-main h1 {
        font-size: 1.75rem;
      }
      
      .site-main h2 {
        font-size: 1.5rem;
      }
      
      .site-main pre {
        padding: 1rem;
        border-radius: 8px;
      }
      
      .tech-badges {
        gap: 0.5rem;
      }
      
      .tech-badge {
        padding: 0.4rem 0.75rem;
        font-size: 0.8rem;
      }
    }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .site-main {
      animation: fadeIn 0.5s ease-out;
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="site-wrapper">
    <!-- Header -->
    <header class="site-header">
      <div class="header-inner">
        <a href="{{ '/' | relative_url }}" class="logo-section">
          <div class="logo-icon">FrostCore</div>
          <div class="logo-text">Jafa<span>.dev</span></div>
        </a>
        
        <nav class="header-nav">
          <ul class="nav-links">
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            <li><a href="{{ '/md_pages/about/' | relative_url }}">About</a></li>
            <li><a href="{{ '/md_pages/proyectos/' | relative_url }}">Projects</a></li>
            <li><a href="{{ '/md_pages/technical_portfolio/' | relative_url }}">Technical Portfolio</a></li>
            <li><a href="{{ '/md_pages/blog/' | relative_url }}">Blog</a></li>
            <!-- <li><a href="{{ '/md_pages/sci/' | relative_url }}">Snake Code Institute</a></li> -->
            <li><a href="{{ site.github.owner_url }}">GitHub</a></li>
          </ul>
          
          <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Cambiar tema">
            <i class="fas fa-moon" id="theme-icon"></i>
          </button>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="site-main">
      {{ content }}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="{{ site.github.owner_url }}"><i class="fab fa-github"></i> GitHub</a>
          <a href="https://linktr.ee/frost_core"><i class="fas fa-link"></i> Linktree</a>
          <!-- Agregado enlace a Blog en footer -->
          <a href="{{ '/md_pages/blog/' | relative_url }}"><i class="fas fa-newspaper"></i> Blog</a>
          <!-- <a href="{{ '/md_pages/sci/' | relative_url }}"><i class="fas fa-graduation-cap"></i> Snake Code Institute</a> -->
        </div>
        <p class="footer-copy">
          © {{ 'now' | date: "%Y" }} Jorge de la Flor · 
          Hecho con <i class="fas fa-heart" style="color: var(--accent-rust);"></i> usando Python, Rust & C/C++
        </p>
      </div>
    </footer>
  </div>

  <script>
    // Dark mode toggle
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const icon = document.getElementById('theme-icon');
      
      if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    }
    
    // Apply saved theme on load
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const icon = document.getElementById('theme-icon');
      
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.body.classList.add('dark-mode');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      }
    })();
  </script>
</body>
</html>
