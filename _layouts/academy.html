<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Academy - Jorge de la Flor" }}</title>
  <meta name="description" content="{{ page.description | default: 'Aprende Python y Rust de verdad. Snake Code Institute y Crab Code Institute.' }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --snake-primary: #3b82f6;
      --snake-secondary: #06b6d4;
      --snake-bg: #0a0f1a;
      --snake-glow: rgba(59, 130, 246, 0.2);
      
      --crab-primary: #f97316;
      --crab-secondary: #ef4444;
      --crab-bg: #1a0f0a;
      --crab-glow: rgba(249, 115, 22, 0.2);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--snake-bg);
      color: white;
      line-height: 1.6;
      transition: background-color 0.5s ease;
    }

    body.crab-mode {
      background-color: var(--crab-bg);
    }

    /* ===== NAV ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.active.snake {
      background: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
    }

    .nav-tab.active.crab {
      background: rgba(249, 115, 22, 0.2);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.5);
    }

    .nav-tab img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .nav-tab .emoji {
      font-size: 1.75rem;
      line-height: 1;
    }

    .nav-tab-text {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.3s ease;
    }

    .nav-tab.active.snake .nav-tab-text {
      color: var(--snake-primary);
    }

    .nav-tab.active.crab .nav-tab-text {
      color: var(--crab-primary);
    }

    .nav-divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 0.5rem;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: white;
    }

    .nav-cta {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      color: white;
      transition: all 0.3s ease;
    }

    .nav-cta.snake {
      background: var(--snake-primary);
    }

    .nav-cta.snake:hover {
      background: #2563eb;
    }

    .nav-cta.crab {
      background: var(--crab-primary);
    }

    .nav-cta.crab:hover {
      background: #ea580c;
    }

    /* ===== SECTIONS ===== */
    .section {
      display: none;
      position: relative;
      min-height: 100vh;
      padding-top: 64px;
    }

    .section.active {
      display: block;
    }

    /* Background effects */
    .bg-effects {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
    }

    .snake-section .glow-1 {
      top: 0;
      left: -25%;
      background: rgba(59, 130, 246, 0.2);
    }

    .snake-section .glow-2 {
      bottom: 0;
      right: -25%;
      background: rgba(6, 182, 212, 0.2);
    }

    .crab-section .glow-1 {
      top: 0;
      left: -25%;
      background: rgba(249, 115, 22, 0.2);
    }

    .crab-section .glow-2 {
      bottom: 0;
      right: -25%;
      background: rgba(239, 68, 68, 0.2);
    }

    .grid-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.03;
    }

    .snake-section .grid-pattern {
      background-image: 
        linear-gradient(to right, #3b82f6 1px, transparent 1px),
        linear-gradient(to bottom, #3b82f6 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .crab-section .grid-pattern {
      background-image: 
        linear-gradient(to right, #f97316 1px, transparent 1px),
        linear-gradient(to bottom, #f97316 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      padding: 6rem 1rem;
      text-align: center;
    }

    .hero-logo {
      font-size: 5rem;
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }

    .hero-logo img {
      width: 128px;
      height: 128px;
      object-fit: contain;
      filter: drop-shadow(0 0 30px var(--snake-glow));
    }

    .crab-section .hero-logo img,
    .crab-section .hero-logo {
      filter: drop-shadow(0 0 30px var(--crab-glow));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .badge {
      display: inline-block;
      padding: 0.375rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .snake-section .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.3);
    }

    .crab-section .badge {
      background: rgba(249, 115, 22, 0.2);
      color: #fb923c;
      box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.3);
    }

    .hero-title {
      margin-top: 1.5rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .hero-title .gradient {
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .snake-section .hero-title .gradient {
      background-image: linear-gradient(to right, #60a5fa, #22d3ee, #3b82f6);
    }

    .crab-section .hero-title .gradient {
      background-image: linear-gradient(to right, #fb923c, #f87171, #f97316);
    }

    .hero-description {
      max-width: 42rem;
      margin: 1.5rem auto 0;
      font-size: 1.125rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn-primary.snake {
      background: var(--snake-primary);
      color: white;
    }

    .btn-primary.snake:hover {
      background: #2563eb;
    }

    .btn-primary.crab {
      background: var(--crab-primary);
      color: white;
    }

    .btn-primary.crab:hover {
      background: #ea580c;
    }

    .btn-secondary.snake {
      border: 1px solid rgba(59, 130, 246, 0.5);
      color: #60a5fa;
    }

    .btn-secondary.snake:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .btn-secondary.crab {
      border: 1px solid rgba(249, 115, 22, 0.5);
      color: #fb923c;
    }

    .btn-secondary.crab:hover {
      background: rgba(249, 115, 22, 0.1);
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      max-width: 42rem;
      margin: 4rem auto 0;
      padding-top: 3rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-value {
      font-size: 1.875rem;
      font-weight: 700;
    }

    .snake-section .stat-value {
      color: #60a5fa;
    }

    .crab-section .stat-value {
      color: #fb923c;
    }

    .stat-label {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* ===== CONTENT SECTIONS ===== */
    .content-section {
      position: relative;
      padding: 6rem 1rem;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-title {
      font-size: clamp(1.875rem, 5vw, 2.5rem);
      font-weight: 700;
    }

    /* Code preview */
    .code-preview {
      margin-top: 2rem;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #0d1117;
    }

    .snake-section .code-preview {
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .crab-section .code-preview {
      border: 1px solid rgba(249, 115, 22, 0.2);
    }

    .code-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .code-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .code-dot.red { background: #ef4444; }
    .code-dot.yellow { background: #eab308; }
    .code-dot.green { background: #22c55e; }

    .code-filename {
      margin-left: 0.5rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .code-content {
      padding: 1.5rem;
      overflow-x: auto;
      font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.7;
    }

    .code-content .comment { color: #6b7280; }
    .code-content .keyword { color: #c084fc; }
    .code-content .function { color: #60a5fa; }
    .code-content .string { color: #4ade80; }
    .code-content .class { color: #facc15; }
    .code-content .variable { color: #fb923c; }
    .code-content .type { color: #facc15; }

    /* Modules grid */
    .modules-grid {
      display: grid;
      gap: 1rem;
      margin-top: 3rem;
    }

    @media (min-width: 640px) {
      .modules-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .modules-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .module-card {
      padding: 1.5rem;
      border-radius: 0.75rem;
      transition: all 0.3s ease;
    }

    .snake-section .module-card {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .snake-section .module-card:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.4);
    }

    .crab-section .module-card {
      background: rgba(249, 115, 22, 0.05);
      border: 1px solid rgba(249, 115, 22, 0.2);
    }

    .crab-section .module-card:hover {
      background: rgba(249, 115, 22, 0.1);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .module-num {
      font-size: 0.875rem;
      font-weight: 700;
    }

    .snake-section .module-num {
      color: var(--snake-primary);
    }

    .crab-section .module-num {
      color: var(--crab-primary);
    }

    .module-title {
      margin-top: 0.5rem;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .module-desc {
      margin-top: 0.25rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* CTA */
    .cta-section {
      position: relative;
      padding: 6rem 1rem;
      text-align: center;
    }

    .cta-title {
      font-size: clamp(1.875rem, 5vw, 2.5rem);
      font-weight: 700;
    }

    .cta-description {
      margin-top: 1rem;
      font-size: 1.125rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 1rem 2rem;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      color: white;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      transform: scale(1.05);
    }

    .snake-section .cta-button {
      background: var(--snake-primary);
    }

    .snake-section .cta-button:hover {
      background: #2563eb;
    }

    .crab-section .cta-button {
      background: var(--crab-primary);
    }

    .crab-section .cta-button:hover {
      background: #ea580c;
    }

    /* Footer */
    .footer {
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .nav-tab-text {
        display: none;
      }
      
      .hero-buttons {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 100%;
        max-width: 280px;
        justify-content: center;
      }
    }
  </style>
</head>
<body class="{% if page.mode == 'crab' %}crab-mode{% endif %}">
  <!-- NAV GLOBAL -->
  <nav class="nav">
    <div class="nav-container">
      <div class="nav-tabs">
        <a class="nav-tab snake{% if page.mode == 'snake' or page.mode == nil %} active{% endif %}"
           href="{{ '/md_pages/sci/' | relative_url }}">
          <img src="{{ '/assets/images/logo-sci.png' | relative_url }}" alt="Snake Code Institute">
          <span class="nav-tab-text">Snake Code</span>
        </a>

        <div class="nav-divider"></div>

        <a class="nav-tab crab{% if page.mode == 'crab' %} active{% endif %}"
           href="{{ '/md_pages/cci/' | relative_url }}">
          <span class="emoji">🦀</span>
          <span class="nav-tab-text">Crab Code</span>
        </a>
      </div>

      <div class="nav-right">
        <a href="{{ '/' | relative_url }}" class="nav-link">← Jorge.dev</a>
        {% if page.cta_link %}
          <a href="{{ page.cta_link }}" class="nav-cta {% if page.mode == 'crab' %}crab{% else %}snake{% endif %}">
            {{ page.cta_label | default: 'Inscribirme' }}
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- BACKGROUND GLOBAL -->
  <div class="bg-effects">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="grid-pattern"></div>
  </div>

  <!-- CONTENIDO ESPECÍFICO DE LA PÁGINA -->
  <main class="section {% if page.mode == 'crab' %}crab-section{% else %}snake-section{% endif %} active"
        style="padding-top: 64px;">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <p>2025 Snake & Crab Code – Formación profesional en Python y Rust</p>
  </footer>
</body>
</html>
